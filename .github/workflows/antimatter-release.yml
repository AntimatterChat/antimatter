name: Antimatter release

# Builds Antimatter's release files: the web apps once (classic and Fusion), then per architecture
# (linux/amd64, linux/arm64) the server and amctl, the release archive (make package-linux-<arch>:
# bin/, client/, client-fusion/, config/, i18n/, templates/, fonts/, prepackaged_plugins/) and the
# all-in-one .deb and .rpm packages (server/build/package: /opt/antimatter, antimatter.service,
# settings in /etc/antimatter). prepackaged_plugins/ holds the latest signed release of every app
# listed in antimatter-docker's plugins.json; apps without a release yet are skipped with a
# warning. Every file is listed in SHA256SUMS.
#
# - A v* tag publishes them as the GitHub release of the tag (version = the tag without "v",
#   shown as the build number by `antimatter version`; a prerelease when the tag has a "-", e.g.
#   v1.2.0-rc.1), with notes generated by GitHub.
# - A manual run builds version 0.9.0-dev.<run>.g<commit> and uploads the files as workflow
#   artifacts only, or also as a draft prerelease when "draft" is ticked.
#
# PostgreSQL isn't bundled: the packages recommend it. The Docker image is built by
# AntimatterChat/antimatter-docker.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Also publish the build as a draft prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # nfpm (https://github.com/goreleaser/nfpm), which builds the .deb and .rpm packages.
  NFPM_VERSION: v2.48.0

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.9.0-dev.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}"
          fi
          # The packages need a semantic version (1.2.0, 1.2.0-rc.1).
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${GITHUB_REF_NAME} isn't a vX.Y.Z or vX.Y.Z-suffix tag"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building Antimatter ${version}" >> "$GITHUB_STEP_SUMMARY"

  webapp:
    name: Web apps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up the web app
        uses: ./.github/actions/antimatter-webapp-setup
      - name: Build the classic web app and Fusion
        working-directory: webapp
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
      - name: Pack them
        run: tar -czf "$RUNNER_TEMP/webapp-dist.tar.gz" -C webapp channels/dist fusion/dist
      - name: Upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: webapp-dist
          path: ${{ runner.temp }}/webapp-dist.tar.gz
          if-no-files-found: error
          retention-days: 3

  apps:
    name: Bundled apps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download the apps' latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: server/build/package/fetch-apps.sh "$RUNNER_TEMP/apps"
      - name: Upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bundled-apps
          # apps.txt is always there, so the artifact exists even when no app has a release yet.
          path: ${{ runner.temp }}/apps
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package (linux/${{ matrix.arch }})
    needs: [version, webapp, apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/public/go.sum
      - name: Download the web apps
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: webapp-dist
          path: ${{ runner.temp }}
      - name: Download the bundled apps
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: bundled-apps
          path: ${{ runner.temp }}/apps
      - name: Unpack the web apps
        run: tar -xzf "$RUNNER_TEMP/webapp-dist.tar.gz" -C webapp
      # BUILD_NUMBER is the version (model.BuildNumber), BUILD_HASH the commit: `antimatter
      # version` prints both. CGO is off so that the binaries are static and run on any glibc,
      # like the cross-compiled arm64 ones.
      - name: Build the server and amctl
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: make build-linux-"$ARCH" BUILD_NUMBER="$VERSION"
      - name: Make the release archive
        working-directory: server
        run: |
          make package-linux-"$ARCH" BUILD_NUMBER="$VERSION" PLUGIN_PACKAGES= \
            PREPACKAGED_PLUGINS_DIR="$RUNNER_TEMP/apps"
          ls -l dist/
      - name: Check the version
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          tar -xzf server/dist/antimatter-linux-amd64.tar.gz -C "$RUNNER_TEMP" antimatter/bin
          "$RUNNER_TEMP/antimatter/bin/antimatter" version | tee "$RUNNER_TEMP/version.txt"
          grep -qx "Build Number: ${VERSION}" "$RUNNER_TEMP/version.txt"
          grep -qx "Build Hash: ${GITHUB_SHA}" "$RUNNER_TEMP/version.txt"
          "$RUNNER_TEMP/antimatter/bin/amctl" version
      - name: Install nfpm
        run: go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
      - name: Test the packaging
        if: matrix.arch == 'amd64'
        run: server/build/package/test-build-packages.sh
      - name: Build the .deb and .rpm packages
        run: |
          server/build/package/build-packages.sh "server/dist/antimatter-linux-${ARCH}.tar.gz" "$ARCH" \
            "$VERSION" "$RUNNER_TEMP/release"
      - name: Upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: antimatter-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0

  checksums:
    name: Checksums
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: antimatter-linux-*
          path: release
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: antimatter-release
          path: release
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the release
    needs: [version, checksums]
    if: github.event_name == 'push' || inputs.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: antimatter-release
          path: release
      - name: Publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" --clobber ./*
              exit 0
            fi
            flags=(--verify-tag --generate-notes --title "Antimatter ${VERSION}")
            case "$tag" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$tag" "${flags[@]}" ./*
          else
            tag="dev-${GITHUB_RUN_NUMBER}"
            run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Antimatter development build ${VERSION}" \
              --notes "Development build of ${GITHUB_SHA} (${run}). Not a release." \
              ./*
          fi
