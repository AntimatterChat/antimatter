name: Antimatter tests

# Every test suite with coverage: the Go server tests against Postgres, MinIO, Inbucket and Azurite (in 6
# shards), and jest for Fusion, classic and the platform packages. The coverage job publishes the statistics
# in its summary and the HTML reports as the "antimatter-coverage" artifact. Failures listed in
# scripts/antimatter/known-failures.txt (temporary) are reported as warnings; anything else fails the job.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: antimatter-tests-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SERVER_SHARDS: 6

jobs:
  server:
    name: Server (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      TEST_DATABASE_POSTGRESQL_DSN: postgres://mmuser:mostest_password@localhost:5432/mattermost_test?sslmode=disable&connect_timeout=10
      CI_MINIO_HOST: localhost
      CI_MINIO_PORT: "9000"
      CI_INBUCKET_HOST: localhost
      CI_INBUCKET_PORT: "9001"
      CI_INBUCKET_SMTP_PORT: "10025"
      CI_AZURITE_HOST: localhost
      CI_AZURITE_PORT: "10000"
      # No AM_EMAILSETTINGS_SMTP* overrides: the default SMTP server (localhost:10025) is Inbucket's, and an
      # override would also beat the tests that point SMTP somewhere unreachable to check the failure paths.
      IS_CI: "true"
      ENABLE_COVERAGE: "true"
      # The services above are running: a test that can't reach one fails instead of skipping.
      AM_TEST_REQUIRE_SERVICES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/public/go.sum
      - name: Restore test durations (balances the shards)
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: server/prev-gotestsum.json
          key: am-server-test-timing-v1-${{ github.run_id }}
          restore-keys: am-server-test-timing-v1-
      - name: Start Postgres, MinIO, Inbucket and Azurite
        run: |
          docker compose -f scripts/antimatter/test-services.yml up -d --wait
          docker compose -f scripts/antimatter/test-services.yml exec -T minio sh -c 'mkdir -p /data/mattermost-test'
      - name: Run the tests
        env:
          SHARD: ${{ matrix.shard }}
        run: SHARD_INDEX=$((SHARD - 1)) SHARD_TOTAL=$SERVER_SHARDS scripts/antimatter/server-tests.sh
      - name: Upload results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: am-server-shard-${{ matrix.shard }}
          path: |
            server/gotestsum.json
            server/report.xml
            server/cover.out
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web (${{ matrix.app }} shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [fusion, channels]
        shard: [1, 2, 3]
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      TZ: Etc/UTC
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up the web app
        uses: ./.github/actions/antimatter-webapp-setup
      - name: Run jest
        working-directory: webapp/${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          npx jest --ci --maxWorkers=100% --forceExit --shard="$SHARD/3" \
            --coverage --coverageReporters=json --coverageDirectory=coverage/shard \
            --json --outputFile=jest-results.json || status=$?
          echo "jest exit status: $status (the known-failures check below decides)"
          label=$([ "$APP" = channels ] && echo "Classic" || echo "Fusion")
          python3 ../../scripts/antimatter/test_results.py jest --label "$label jest (shard $SHARD/3)" jest-results.json
      - name: Upload results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: am-web-${{ matrix.app }}-shard-${{ matrix.shard }}
          path: |
            webapp/${{ matrix.app }}/jest-results.json
            webapp/${{ matrix.app }}/coverage/shard/coverage-final.json
          if-no-files-found: warn
          retention-days: 7

  platform:
    name: Web (platform packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      TZ: Etc/UTC
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up the web app
        uses: ./.github/actions/antimatter-webapp-setup
      - name: Run jest
        working-directory: webapp/platform
        run: |
          results=()
          for pkg in client components shared; do
            (cd "$pkg" && npx jest --ci --maxWorkers=100% --forceExit \
              --coverage --coverageReporters=json --coverageDirectory=coverage \
              --json --outputFile=jest-results.json) || echo "jest in platform/$pkg exited with $?"
            results+=("$pkg/jest-results.json")
          done
          python3 ../../scripts/antimatter/test_results.py jest --label "Platform packages jest" "${results[@]}"
      - name: Upload results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: am-web-platform
          path: |
            webapp/platform/*/jest-results.json
            webapp/platform/*/coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Coverage report
    needs: [server, web, platform]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/public/go.sum
      - name: Set up the web app
        uses: ./.github/actions/antimatter-webapp-setup
      - name: Download the shards' results
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: am-*
          path: shards
      - name: Merge coverage and write the summary
        run: |
          out=coverage-report
          mkdir -p "$out"
          for app in fusion channels; do
            area=$([ "$app" = channels ] && echo classic || echo fusion)
            node scripts/antimatter/merge_jest_coverage.js "$out/$area" shards/am-web-"$app"-shard-*/coverage/shard/coverage-final.json || true
          done
          node scripts/antimatter/merge_jest_coverage.js "$out/platform" shards/am-web-platform/*/coverage/coverage-final.json || true
          python3 scripts/antimatter/coverage_summary.py --out "$out" \
            --go shards/am-server-shard-*/cover.out \
            --jest "fusion=$out/fusion/coverage-summary.json" \
            --jest "classic=$out/classic/coverage-summary.json" \
            --jest "platform=$out/platform/coverage-summary.json"
      - name: Server HTML coverage report
        working-directory: server
        run: |
          if [ ! -f ../coverage-report/server-cover.out ]; then echo "No server coverage profile."; exit 0; fi
          make setup-go-work
          go tool cover -html=../coverage-report/server-cover.out -o ../coverage-report/server-coverage.html
      - name: Upload the coverage reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: antimatter-coverage
          path: coverage-report
          retention-days: 30
      - name: Keep the test durations for the next runs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.server.result == 'success' }}
        run: cat shards/am-server-shard-*/gotestsum.json > server/prev-gotestsum.json
      - name: Save the test durations
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.server.result == 'success' }}
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: server/prev-gotestsum.json
          key: am-server-test-timing-v1-${{ github.run_id }}
