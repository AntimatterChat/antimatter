name: Docs Editor Review Label

# Auto-apply "2: Editor Review" when a non-draft PR changes docs/**.
# API OpenAPI changes are intentionally excluded; drafts are skipped until ready_for_review.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "docs/**"
      - "!docs/site/**"
      - "!docs/vendor/**"
      

permissions: {}

concurrency:
  group: docs-editor-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Antimatter: this workflow needs Mattermost's infrastructure or secrets, or is replaced by an
# antimatter-*.yml workflow. It is kept to ease upstream merges and only runs in Mattermost's repo.
jobs:
  label:
    if: >-
      github.repository_owner == 'mattermost' && (
        github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Add Editor Review label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-label "2: Editor Review"
