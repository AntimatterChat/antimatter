name: docs-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'docs/**'
      - 'api/**'

permissions:
  contents: read
  statuses: write

# Antimatter: this workflow needs Mattermost's infrastructure or secrets, or is replaced by an
# antimatter-*.yml workflow. It is kept to ease upstream merges and only runs in Mattermost's repo.
jobs:
  deploy:
    uses: ./.github/workflows/docs-preview-template.yml
    if: github.repository_owner == 'mattermost' && (github.event.pull_request.head.repo.full_name == github.repository)
    secrets:
      AWS_DOCS_PR_PREVIEW_KEY_ID: ${{ secrets.AWS_DOCS_PR_PREVIEW_KEY_ID }}
      AWS_DOCS_PR_PREVIEW_SECRET_ACCESS_KEY: ${{ secrets.AWS_DOCS_PR_PREVIEW_SECRET_ACCESS_KEY }}
    with:
      PR_NUMBER: ${{ github.event.number }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      STATUS_CONTEXT: docs-preview
