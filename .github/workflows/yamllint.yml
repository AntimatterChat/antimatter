name: YAML Lint

on:
  push:
    branches:
      - master
      - release-*
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".yamllint"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Antimatter: this workflow needs Mattermost's infrastructure or secrets, or is replaced by an
# antimatter-*.yml workflow. It is kept to ease upstream merges and only runs in Mattermost's repo.
jobs:
  yamllint:
    if: github.repository_owner == 'mattermost'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Lint workflow YAML files
        run: yamllint .github/workflows/
