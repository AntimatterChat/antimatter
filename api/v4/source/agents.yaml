  /api/v4/agents:
    get:
      tags:
        - agents
      summary: Get available agents
      description: >
        Lists the built-in agents the caller may talk to (Antimatter: the server's agents, enabled, not external),
        each with its model connection as its service. Kept for older apps; new code uses `/api/v4/ai/agents`.

        ##### Permissions

        Must be authenticated.

        __Minimum server version__: 11.2
      operationId: GetAgents
      responses:
        "200":
          description: Agents retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/agents/status:
    get:
      tags:
        - agents
      summary: Get agents bridge status
      description: >
        Tells whether the caller has an agent to talk to, with a reason code when not
        (`app.agents.status.no_agents`).

        ##### Permissions

        Must be authenticated.

        __Minimum server version__: 11.2
      operationId: GetAgentsStatus
      responses:
        "200":
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsIntegrityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/llmservices:
    get:
      tags:
        - agents
      summary: Get available LLM services
      description: >
        Lists the model connections the caller may use (Antimatter), as the AI chat app's services were listed:
        their ID, name and provider, never a key.

        ##### Permissions

        Must be authenticated.

        __Minimum server version__: 11.2
      operationId: GetLLMServices
      responses:
        "200":
          description: LLM services retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

