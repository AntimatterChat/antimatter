  /api/v4/ip_filtering:
    get:
      tags:
        - ip
        - filtering
      summary: Get IP filtering rules
      description: >
        Retrieve the IP filtering rules. A client matching an enabled deny rule
        is refused. If any allow rule is enabled, the client must also match one
        of them. With no enabled rule, every client is let through.

        ##### Permissions

        Must have the `sysconsole_read_site_ip_filters` permission.

        __Minimum server version__: 9.1
      operationId: GetIPFilters
      responses:
        "200":
          description: IP filtering rules returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllowedIPRange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - ip
        - filtering
      summary: Replace IP filtering rules
      description: >
        Replace the IP filtering rules with the given list. Rules that would
        block the address the request comes from are refused, since the
        requester could no longer undo them. Local mode is not subject to IP
        filtering and can always be used to clear the rules.

        ##### Permissions

        Must have the `sysconsole_write_site_ip_filters` permission.

        __Minimum server version__: 9.1
      operationId: ApplyIPFilters
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AllowedIPRange"
        description: The complete list of IP filtering rules
        required: true
      responses:
        "200":
          description: IP filtering rules applied successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllowedIPRange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v4/ip_filtering/my_ip:
    get:
      tags:
        - ip
        - filtering
      summary: Get your IP address
      description: >
        Retrieve your current IP address as seen by the server, taking the
        configured trusted proxy headers into account.

        __Minimum server version__: 9.1
      operationId: MyIP
      responses:
        "200":
          description: IP address returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ip:
                    type: string
                    description: Your current IP address
                    example: "192.168.0.1"
        "401":
          $ref: "#/components/responses/Unauthorized"
