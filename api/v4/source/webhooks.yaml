  "/api/v4/channels/{channel_id}/message_actions":
    get:
      tags:
        - webhooks
      summary: Get the message actions of a channel
      description: >
        Get the message actions (outgoing webhooks with `trigger_when` `2`) that the current user may pick for the
        messages of a channel: the ones bound to the channel, and, except for guests, the ones of its team without a
        channel. Only public channels have message actions. Neither tokens nor callback URLs are returned
        (Antimatter).

        ##### Permissions

        Read access to the channel.
      operationId: GetMessageActionsForChannel
      parameters:
        - name: channel_id
          in: path
          description: Channel GUID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The message actions, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    team_id:
                      type: string
                    channel_id:
                      type: string
                    display_name:
                      type: string
                    description:
                      type: string
                    icon_url:
                      description: The uploaded icon, or an http(s) image URL; empty for none
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v4/posts/{post_id}/message_actions/{hook_id}":
    post:
      tags:
        - webhooks
      summary: Send a message to a message action
      description: >
        Send a message to the callback URLs of a message action, as the current user (Antimatter). The payload has
        `trigger` `message_action`, the webhook's `token`, the message (`post_id`, `text`, `post_user_id`,
        `post_user_name`, `post_create_at`, `permalink`, `files` with their names and links, `priority`,
        `requested_ack`), its channel and team, and who picked the action (`user_id`, `user_name`). A burn-on-read
        message is sent without its text and files (`burn_on_read` is `true`). The webhook may answer as an
        outgoing webhook does (`text`, `attachments`, `response_type`), or with an `ephemeral_text` returned to
        the current user alone. Where the current user can't post (a read-only or archived channel), an answer is
        shown to them alone instead of posted. Each user may run 10 message actions a minute, after a burst of 5.

        ##### Permissions

        Read access to the message.
      operationId: RunMessageAction
      parameters:
        - name: post_id
          in: path
          description: Post GUID
          required: true
          schema:
            type: string
        - name: hook_id
          in: path
          description: Outgoing webhook GUID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The message was sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ephemeral_text:
                    description: The webhook's `ephemeral_text`, if any
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          description: None of the webhook's callback URLs could be reached
