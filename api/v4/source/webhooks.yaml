        `icon_url` points at it (Antimatter).

        ##### Permissions

        The permissions to update the webhook: `manage_outgoing_webhooks` for the team, and
        `manage_others_outgoing_webhooks` if someone else created it.
      operationId: SetOutgoingWebhookIcon
